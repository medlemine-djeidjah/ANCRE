[package]
name = "ancre-ingester"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NATS to ClickHouse. Allocates seq, computes the chain."

[lib]
name = "ancre_ingester"
path = "src/lib.rs"

[[bin]]
name = "ancre-ingester"
path = "src/main.rs"

[dependencies]
ancre-canon = { workspace = true }
ancre-types = { workspace = true }
ancre-chain = { workspace = true }
tokio = { workspace = true }
async-nats = { workspace = true }
clickhouse = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

smallvec = { workspace = true }

[dev-dependencies]
ancre-types = { workspace = true, features = ["fixtures"] }
ancre-chain = { workspace = true, features = ["fixtures"] }
ancre-canon = { workspace = true }

[lints]
workspace = true
