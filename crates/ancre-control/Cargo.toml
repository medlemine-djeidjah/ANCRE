[package]
name = "ancre-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Control plane. Registry, snapshot build, checkpoint signing."

[lib]
name = "ancre_control"
path = "src/lib.rs"

[[bin]]
name = "ancre-control"
path = "src/main.rs"

[features]
# In-memory Registry and key store, for this crate's tests, the gateway's
# config-feed tests, and the config gate. Never enabled by the binary: a
# control plane that can serve fixture data is one command-line flag away from
# publishing fixture pins into a customer's evidence.
testing = ["ancre-types/fixtures", "ancre-chain/fixtures"]

[dependencies]
ancre-canon = { workspace = true }
ancre-types = { workspace = true }
ancre-chain = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
clickhouse = { workspace = true }
# The canonical reader for `audit_events` lives in the ingester, and a
# hash-critical row mapping must exist exactly once.
ancre-ingester = { workspace = true }
async-nats = { workspace = true }
# The dashboard, compiled into the binary. Build-time only for the JS side:
# nothing in the shipped image needs Node.
rust-embed = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
ancre-types = { workspace = true, features = ["fixtures"] }
ancre-chain = { workspace = true, features = ["fixtures"] }
ancre-resolver = { workspace = true, features = ["testing"] }
ancre-control = { workspace = true, features = ["testing"] }
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
