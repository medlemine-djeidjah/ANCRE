name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  # Both hash feature flags must build and pass. The SHA-256 path is not
  # optional decoration — it is what an enterprise crypto policy will demand,
  # and it must not rot (mvp-plan §8.2).
  hash-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ancre-canon --no-default-features --features hash-sha256
      - run: cargo test -p ancre-chain --features fixtures,ancre-canon/hash-sha256

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The latency claim is a product feature, so missing it fails the build.
  #
  # This checks the absolute targets in resolver spec §9 against raw
  # percentiles. A shared CI runner is noisier than a real gateway node, so a
  # failure here means "go measure on real hardware", not "ship it anyway".
  latency-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p ancre-bench --release --example resolve-gate

  # Criterion, for drift over time rather than absolute targets. Not gating:
  # criterion alone will not fail a build, and wiring up critcmp against a
  # stored baseline is M3 work.
  bench-drift:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p ancre-bench -- --save-baseline main
