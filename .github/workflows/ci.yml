name: ci

on:
  push:
    branches: [master]
  pull_request:
  # A milestone lives on its own branch and only reaches master through a PR,
  # so without this the only way to run the pipeline against unmerged work is
  # to open the PR first. That is backwards for a gate whose whole purpose is
  # to be run before anyone is asked to look.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  # Both hash feature flags must build and pass. The SHA-256 path is not
  # optional decoration — it is what an enterprise crypto policy will demand,
  # and it must not rot (mvp-plan §8.2).
  hash-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ancre-canon --no-default-features --features hash-sha256
      - run: cargo test -p ancre-chain --features fixtures,ancre-canon/hash-sha256

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The transports, against the real thing.
  #
  # Every one of these suites is a no-op without its `ANCRE_TEST_*` variable,
  # which is what keeps `cargo test` green on a laptop with no Docker — and
  # exactly why they need a job that always sets them. A test that runs only
  # when someone remembers to export a variable is a test that rots, and the
  # four bugs the first real ClickHouse run found were all invisible to the
  # unit tests.
  #
  # `docker run` rather than `services:`, because ClickHouse and Postgres need
  # their init SQL mounted from the repo and a service container cannot see it.
  transports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Start ClickHouse, Postgres and NATS
        run: |
          docker run -d --name ancre-ch -p 18123:8123 \
            -e CLICKHOUSE_USER=ancre -e CLICKHOUSE_PASSWORD=ancre -e CLICKHOUSE_DB=ancre \
            -v "$PWD/deploy/compose/init/clickhouse:/docker-entrypoint-initdb.d:ro" \
            --ulimit nofile=262144:262144 \
            clickhouse/clickhouse-server:24.8
          docker run -d --name ancre-pg -p 15432:5432 \
            -e POSTGRES_USER=ancre -e POSTGRES_PASSWORD=ancre -e POSTGRES_DB=ancre \
            -v "$PWD/deploy/compose/init/postgres:/docker-entrypoint-initdb.d:ro" \
            postgres:16-alpine
          docker run -d --name ancre-nats -p 14222:4222 nats:2.10-alpine -js -sd /data

      - name: Wait for them to accept connections
        run: |
          for _ in $(seq 1 60); do
            docker exec ancre-pg pg_isready -U ancre -d ancre >/dev/null 2>&1 && break
            sleep 1
          done
          for _ in $(seq 1 60); do
            curl -sf "http://127.0.0.1:18123/?user=ancre&password=ancre" \
              --data "SELECT count() FROM ancre.audit_events" >/dev/null && break
            sleep 1
          done

      # Serialised: the suites share one Postgres, and one of them resets the
      # tables between cases.
      - name: Run the transport suites
        env:
          ANCRE_TEST_CLICKHOUSE: http://127.0.0.1:18123
          ANCRE_TEST_POSTGRES: postgres://ancre:ancre@127.0.0.1:15432/ancre
          ANCRE_TEST_NATS: nats://127.0.0.1:14222
        run: |
          cargo test -p ancre-ingester --test clickhouse -- --test-threads=1
          cargo test -p ancre-ingester --test bus -- --test-threads=1
          cargo test -p ancre-control --test postgres -- --test-threads=1
          cargo test -p ancre-control --test clickhouse -- --test-threads=1
          cargo test -p ancre-control --test bus -- --test-threads=1

  # M5's done-when, as a job: a stranger clones the repo and gets a verified
  # chain without asking a question.
  #
  # This is the only job that builds the container images, and the only one
  # that exercises the three binaries against each other through the network
  # they will actually run on. Everything the other jobs check is a property of
  # the code; this checks the property the milestone was defined by, which is
  # that the packaging works.
  #
  # `quickstart.sh` is a gate and not a demo script: it exits non-zero if the
  # stack does not come up, if the chain comes back short, if the pack fails to
  # verify — and, crucially, if the tampered pack *passes*. A verifier that
  # stopped detecting tampering would leave every other job in this file green.
  quickstart:
    runs-on: ubuntu-latest
    # The release build with fat LTO dominates this, and a cold runner has no
    # cargo cache to reuse inside the image build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/compose/quickstart.sh
      - name: Container logs, if it failed
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml --profile demo logs --tail=200

  # The latency claim is a product feature, so missing it fails the build.
  #
  # This checks the absolute targets in resolver spec §9 against raw
  # percentiles. A shared CI runner is noisier than a real gateway node, so a
  # failure here means "go measure on real hardware", not "ship it anyway".
  latency-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p ancre-bench --release --example resolve-gate
      - run: cargo run -p ancre-bench --release --example overhead-gate
      - run: cargo run -p ancre-bench --release --example chaos-gate
      - run: cargo run -p ancre-bench --release --example config-gate

  # Criterion, for drift over time rather than absolute targets. Not gating:
  # criterion alone will not fail a build, and wiring up critcmp against a
  # stored baseline is M3 work.
  bench-drift:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p ancre-bench -- --save-baseline main
