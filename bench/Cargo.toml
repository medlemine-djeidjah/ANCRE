# The latency claim is a product feature, so regressions fail the build.
# These benches gate CI from week 3 (mvp-plan §0).
[package]
name = "ancre-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The two benches below set `harness = false` because they are criterion, but
# the lib target does not, so `cargo bench` also runs it under libtest — which
# has no `--save-baseline` and exits non-zero the moment CI passes one. The lib
# here is fixtures and helpers for the benches; it has nothing to measure.
[lib]
bench = false

[dependencies]
ancre-canon = { workspace = true }
ancre-types = { workspace = true, features = ["fixtures"] }
ancre-chain = { workspace = true, features = ["fixtures"] }
ancre-resolver = { workspace = true, features = ["testing"] }
ancre-gateway = { workspace = true }
ancre-ingester = { workspace = true }
ancre-control = { workspace = true, features = ["testing"] }
ancre-provider = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
arc-swap = { workspace = true }
smallvec = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "canon"
harness = false

[lints]
workspace = true
