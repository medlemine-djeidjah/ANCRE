# `docker compose up` → a working, seeded gateway.
#
# Three Ancre containers and three dependencies is already at the edge of what
# a mid-market platform team will accept — do not add a fourth Ancre service
# (PRD §10). The two extras below sit behind profiles and neither one runs in a
# real deployment:
#
#   docker compose up -d                     the product
#   docker compose --profile demo up -d      the product, plus a fake provider
#
# `deploy/compose/quickstart.sh` runs the second and then proves it works. If
# you are reading this to evaluate Ancre, run that instead of this file.
#
# `restart: unless-stopped` on the three Ancre services is load-bearing.
# Startup ordering across six containers has races that no `depends_on` graph
# removes — a broker that accepts a TCP connection a second before it will
# accept a JetStream publish, for one — and the honest response for a process
# whose dependency is not ready is to exit loudly and be restarted. All three
# of these do exactly that, on purpose.

name: ancre

services:
  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: gateway
      args:
        # The commit these binaries were built from, stamped into every
        # `gateway_version` pin. `quickstart.sh` exports it; unset means the
        # literal `unknown`, which is the honest answer rather than a lie.
        ANCRE_BUILD_SHA: ${ANCRE_BUILD_SHA:-unknown}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      ANCRE_CONTROL_URL: http://control:8081
      ANCRE_NATS_URL: nats://nats:4222
      # Fail closed on stale config for high-risk systems. Configurable,
      # defaulted on, and turning it off is logged as a governance event.
      ANCRE_FAIL_CLOSED_ON_STALE: "true"
      ANCRE_STALENESS_BUDGET_SECS: "30"
      # Unset in a real deployment, which is what makes adoption a base-URL
      # change on the customer's side and nothing else. `quickstart.sh` points
      # it at the mock, so that a demo needs nobody's API key.
      ANCRE_OPENAI_BASE: ${ANCRE_OPENAI_BASE:-https://api.openai.com}
      ANCRE_ANTHROPIC_BASE: ${ANCRE_ANTHROPIC_BASE:-https://api.anthropic.com}
      # The deployment's own provider credentials, read from the environment
      # that runs `docker compose` (put them in `deploy/compose/.env`, which is
      # gitignored). They are never taken from a request: a caller presents a
      # virtual key naming a system in the registry, and forwarding that
      # upstream would make this a proxy for whoever asked rather than for the
      # customer who deployed it.
      #
      # Unset is fine for the demo and for a self-hosted model behind an
      # overridden base URL. Against a real provider it is a 401 on every
      # request, and the gateway says so at startup.
      ANCRE_OPENAI_API_KEY: ${ANCRE_OPENAI_API_KEY:-}
      ANCRE_ANTHROPIC_API_KEY: ${ANCRE_ANTHROPIC_API_KEY:-}
    depends_on:
      control: { condition: service_healthy }
      nats: { condition: service_started }
    healthcheck:
      # The gateway is a proxy: it has no health route, and adding one would
      # mean a path a customer's own traffic could collide with. An
      # unauthenticated request answered with 401 proves the socket is bound
      # and the request path is running, which is the whole question.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/chat/completions | grep -q 401"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  control:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: control
      args:
        ANCRE_BUILD_SHA: ${ANCRE_BUILD_SHA:-unknown}
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: postgres://ancre:ancre@postgres:5432/ancre
      ANCRE_NATS_URL: nats://nats:4222
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ancre
      CLICKHOUSE_USER: ancre
      CLICKHOUSE_PASSWORD: ancre
      # MVP key custody: a control-plane-local file on a named volume, so that
      # `docker compose down && up` keeps signing with the same key and the
      # checkpoints from the previous run keep verifying. Enterprise moves this
      # to Vault — the first security questionnaire will ask (mvp-plan §8.3).
      #
      # Emphatically not `/run/secrets/`, which is where this used to point:
      # the control plane *mints* this key on first boot, and a secrets mount
      # is read-only. Nothing could ever have started.
      ANCRE_SIGNING_KEY_PATH: /var/lib/ancre/keys/checkpoint-key
      # The checkpoint policy, defaulted to mvp-plan §4's 10 000 events or 5
      # minutes. Listed here with defaults rather than left to the binary,
      # because a variable exported in the shell that runs `docker compose`
      # reaches a container only if this file names it — `quickstart.sh` set
      # these for several runs before anyone noticed they were doing nothing.
      ANCRE_CHECKPOINT_EVERY_N: ${ANCRE_CHECKPOINT_EVERY_N:-10000}
      ANCRE_CHECKPOINT_EVERY_SECS: ${ANCRE_CHECKPOINT_EVERY_SECS:-300}
      ANCRE_CHECKPOINT_INTERVAL_SECS: ${ANCRE_CHECKPOINT_INTERVAL_SECS:-30}
    volumes:
      - control-keys:/var/lib/ancre/keys
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      nats: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One replica, and that is a correctness constraint rather than a capacity
  # one: two ingesters on the same subjects **fork every chain they share**,
  # and a forked chain verifies perfectly on both sides of the split. Scale by
  # giving each replica a disjoint `ANCRE_SUBJECT_FILTER`.
  ingester:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: ingester
      args:
        ANCRE_BUILD_SHA: ${ANCRE_BUILD_SHA:-unknown}
    restart: unless-stopped
    environment:
      ANCRE_NATS_URL: nats://nats:4222
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ancre
      CLICKHOUSE_USER: ancre
      CLICKHOUSE_PASSWORD: ancre
    depends_on:
      clickhouse: { condition: service_healthy }
      nats: { condition: service_started }

  # --- dependencies ---------------------------------------------------------

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    # Without these the image mints a random password for `default` and every
    # connection fails authentication — including the init scripts.
    environment:
      CLICKHOUSE_USER: ancre
      CLICKHOUSE_PASSWORD: ancre
      CLICKHOUSE_DB: ancre
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      # Queries the table, not the server. The init scripts run after the port
      # opens, so an open port is not a usable database — and the ingester's
      # first insert failing with "table does not exist" is exactly the
      # ten-minutes-in failure this file exists to prevent.
      test: ["CMD-SHELL", "clickhouse-client --user ancre --password ancre --query 'SELECT count() FROM ancre.audit_events'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ancre
      POSTGRES_PASSWORD: ancre
      POSTGRES_DB: ancre
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` alone would pass while the init scripts are still running,
      # because the entrypoint starts a local-only server to run them — and so
      # would a query against an empty `api_keys`, which exists after the schema
      # script and before the seed one. Requiring a *row* is what actually means
      # "the registry is here": a control plane that publishes between those two
      # scripts publishes an empty snapshot, and every gateway that installs it
      # then 401s the very key the quickstart is about to present.
      #
      # It ties health to having at least one key, which is right for a real
      # deployment too — a registry with no keys serves nobody.
      test: ["CMD-SHELL", "psql -U ancre -d ancre -tAc 'SELECT count(*) FROM api_keys' | grep -qv '^0$$'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data

  # --- demo only ------------------------------------------------------------

  # A provider that answers like OpenAI, so the quickstart needs nobody's key.
  # Behind a profile because it must never start in a real deployment: a
  # gateway pointed at this would record a fabricated model version as
  # evidence, which is the one thing this product may not do.
  mock-provider:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: mock
      args:
        ANCRE_BUILD_SHA: ${ANCRE_BUILD_SHA:-unknown}
    restart: unless-stopped
    ports: ["9090:9090"]

  # The offline verifier, for a machine with no Rust toolchain.
  #
  #   docker compose run --rm -T verify --chain - < chain.jsonl
  #   docker compose run --rm verify --pack /evidence/acme-hr-screening
  #
  # `network_mode: none` is not decoration. The claim is that verification
  # needs no network, and a container with no network interface is the only
  # form of that claim a sceptic cannot argue with.
  #
  # `./evidence` on the host is where `quickstart.sh` writes a pack, so the
  # verifier and the pack meet in the one directory both can see.
  verify:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile
      target: verify
      args:
        ANCRE_BUILD_SHA: ${ANCRE_BUILD_SHA:-unknown}
    restart: "no"
    network_mode: none
    volumes:
      - ./evidence:/evidence

volumes:
  clickhouse-data:
  postgres-data:
  nats-data:
  control-keys:
